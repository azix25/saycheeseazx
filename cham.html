<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Scanner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 420px;
  margin: auto;
  padding: 15px;
}

h2 {
  margin: 10px 0 15px;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 15px;
  background: #000;
}

.result {
  margin-top: 15px;
  padding: 15px;
  background: #222;
  border-radius: 12px;
}

#hasil {
  display: block;
  margin: 10px 0;
  padding: 12px;
  background: #000;
  border-radius: 8px;
  word-break: break-all;
  color: #00ff88;
  font-size: 18px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #00aaff;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:active {
  transform: scale(.98);
}
</style>
</head>

<body>

<div class="container">

  <h2>📷 Barcode Scanner</h2>

  <div id="reader"></div>

  <div class="result">
    <div>Hasil Scan:</div>
    <span id="hasil">Belum ada barcode</span>

    <button onclick="salinHasil()">📋 Salin Hasil</button>
    <button onclick="mulaiScanner()">🔄 Scan Lagi</button>
  </div>

</div>

<!-- Library scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>

let scanner;
let sedangScan = false;

function mulaiScanner() {

  if (sedangScan) return;

  scanner = new Html5Qrcode("reader");
  sedangScan = true;

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 15,
      qrbox: {
        width: 280,
        height: 150
      }
    },

    function(decodedText) {

      document.getElementById("hasil").textContent = decodedText;

      // Bunyi saat barcode berhasil dibaca
      bunyiScan();

      // Hentikan kamera setelah berhasil scan
      scanner.stop().then(() => {
        sedangScan = false;
      }).catch(() => {
        sedangScan = false;
      });

    },

    function(errorMessage) {
      // Tidak perlu menampilkan error scan realtime
    }

  ).catch(function(error) {

    sedangScan = false;

    document.getElementById("hasil").textContent =
      "Kamera tidak dapat digunakan";

    console.log(error);
  });
}


function bunyiScan() {

  const audioCtx =
    new (window.AudioContext || window.webkitAudioContext)();

  const oscillator = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  oscillator.frequency.value = 1000;
  oscillator.type = "sine";

  gain.gain.value = 0.15;

  oscillator.connect(gain);
  gain.connect(audioCtx.destination);

  oscillator.start();

  setTimeout(() => {
    oscillator.stop();
  }, 120);
}


function salinHasil() {

  const hasil = document.getElementById("hasil").textContent;

  if (
    hasil === "Belum ada barcode" ||
    hasil === "Kamera tidak dapat digunakan"
  ) {
    return;
  }

  navigator.clipboard.writeText(hasil)
    .then(() => {
      alert("Hasil barcode berhasil disalin");
    })
    .catch(() => {
      alert("Tidak dapat menyalin");
    });
}


// Mulai otomatis
window.onload = function() {
  mulaiScanner();
};

</script>

</body>
</html>
